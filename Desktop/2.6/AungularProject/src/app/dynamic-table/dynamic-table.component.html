<div class="table-container">
    <h2>Динамическая таблица</h2>
    <table>
      <thead>
        <tr>
          <th *ngFor="let column of columns">{{column | uppercase}}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of tableData">
          <td *ngFor="let column of columns">{{row[column]}}</td>
        </tr>
      </tbody>
    </table>
  </div>
